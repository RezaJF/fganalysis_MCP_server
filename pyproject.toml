[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fganalysis-mcp"
version = "0.2.1"
description = "Model Context Protocol server for the fganalysis R package"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "python-dotenv",
]

[project.optional-dependencies]
notebook = [
    "google-generativeai"
]

[project.scripts]
fganalysis-mcp = "fganalysis_mcp.server:main"

[tool.setuptools.packages.find]
include = ["fganalysis_mcp*"]
